<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>IPBM 2027 — Program &amp; My Schedule</title>
  <meta name="description" content="International PancreatoBiliary Meeting 2027 — Beyond Innovation, Toward Tomorrow (April 2–3, 2027, Grand Walkerhill Seoul, Korea)" />
  <meta name="theme-color" content="#15988D" />

  <!-- PWA & iOS Home Screen Meta -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IPBM 2027" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    :root {
      --ipbm-teal: #15988D;
      --ipbm-teal-bright: #19A69A;
      --ipbm-teal-soft: #EAF8F6;
      --ipbm-teal-border: #B8E6E1;
      --ipbm-navy: #182B59;
      --ipbm-navy-soft: #EDF1FA;
      --ipbm-rose: #BD406E;
      --ipbm-rose-soft: #FBF0F4;
      --ipbm-rose-border: #F2C4D6;
      --ipbm-blue: #1C8BAE;
      --ipbm-purple: #6A52B5;
      --ipbm-amber: #C97A1E;
      --ipbm-charcoal: #22303C;
      --ipbm-slate: #546E7A;
      --ipbm-border: #E3E8EF;
      --ipbm-bg: #F4F7FA;

      /* Official IPBM Program at a Glance Pastel Tones */
      --pastel-teal: #EAF8F6;
      --pastel-rose: #FCF1F6;
      --pastel-navy: #EEF3FC;
      --pastel-sky: #E9F6FD;
      --pastel-yellow: #FFFBE8;
      --pastel-purple: #F3EFFC;
      --pastel-peach: #FFF2EA;
      --pastel-gray: #FFFFFF;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--ipbm-bg);
      color: var(--ipbm-charcoal);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      background: var(--ipbm-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 32px rgba(24, 43, 89, 0.07);
    }

    /* Sticky Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #FFFFFF;
      border-bottom: 1px solid var(--ipbm-border);
      padding-top: env(safe-area-inset-top);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      gap: 10px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      display: block;
    }

    .brand-date-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 900;
      color: #FFFFFF;
      background: linear-gradient(135deg, #BD406E 0%, #4E4DB2 100%);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 8px rgba(189, 64, 110, 0.25);
    }

    .lang-btn {
      border: 1.5px solid var(--ipbm-teal);
      background: #FFFFFF;
      color: var(--ipbm-teal);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .lang-btn:active {
      background: var(--ipbm-teal);
      color: #FFFFFF;
    }

    /* IPBM Official Navy -> Emerald-Teal -> Blossom Accent Strip */
    .sub-bar {
      background: linear-gradient(95deg, #182B59 0%, #167E96 56%, #19A69A 100%);
      color: #FFFFFF;
      padding: 10px 16px 12px;
    }
    .sub-bar.hidden { display: none; }

    .page-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 11.5px;
      opacity: 0.92;
      margin-top: 2px;
    }

    .search-box {
      margin-top: 10px;
      position: relative;
    }
    .search-input {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 9px 34px 9px 12px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ipbm-charcoal);
      outline: none;
    }
    .search-input::placeholder { color: #78909C; }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #78909C;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      display: none;
    }
    .search-clear.visible { display: block; }

    /* Install Banner */
    .install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--ipbm-teal-soft);
      border-bottom: 1px solid var(--ipbm-teal-border);
      padding: 9px 14px;
      font-size: 12px;
      color: var(--ipbm-charcoal);
    }
    .install-banner.show { display: flex; }
    .install-btn {
      background: var(--ipbm-teal);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .install-close {
      background: transparent;
      border: none;
      color: #78909C;
      font-size: 15px;
      padding: 2px 4px;
      cursor: pointer;
    }

    /* Day Tabs (2 Days: Apr 2 Fri / Apr 3 Sat) */
    .day-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      background: #EEF2F6;
      border-bottom: 1px solid var(--ipbm-border);
    }
    .day-tab {
      border: none;
      background: transparent;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      color: var(--ipbm-slate);
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
    }
    .day-tab.active {
      background: #FFFFFF;
      color: var(--ipbm-teal);
      font-weight: 800;
      border-bottom-color: var(--ipbm-teal);
    }
    .day-tab-main { font-size: 13.5px; font-weight: 800; }
    .day-tab-sub { font-size: 11.5px; margin-top: 2px; opacity: 0.88; }

    /* Filter Chips */
    .chip-row {
      display: flex;
      gap: 6px;
      padding: 9px 14px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--ipbm-border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid #CFD8DC;
      background: #FFFFFF;
      color: var(--ipbm-slate);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--ipbm-navy);
      border-color: var(--ipbm-navy);
      color: #FFFFFF;
    }
    .room-chip-row {
      display: flex;
      gap: 5px;
      padding: 6px 14px 8px;
      background: #FAFBFD;
      border-bottom: 1px solid var(--ipbm-border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .room-chip-row::-webkit-scrollbar { display: none; }
    .room-chip {
      border: 1px solid #DCE4EE;
      background: #FFFFFF;
      color: #475569;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
    }
    .room-chip.active {
      background: var(--ipbm-teal);
      border-color: var(--ipbm-teal);
      color: #FFFFFF;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 14px 14px calc(86px + env(safe-area-inset-bottom));
    }

    /* HOME SCREEN */
    .home-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 6px;
    }
    .home-visual-card {
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(24, 43, 89, 0.08);
    }
    .home-visual-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3 Main Icon Tiles on Home Screen */
    .home-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
    }
    .home-tile {
      background: #FFFFFF;
      border: 2px solid var(--ipbm-teal-border);
      border-radius: 20px;
      padding: 18px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      transition: transform 0.12s ease;
    }
    .home-tile:active { transform: scale(0.96); }
    .home-tile-icon {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    .tile-program .home-tile-icon { background: var(--ipbm-navy); color: #FFFFFF; }
    .tile-my .home-tile-icon      { background: var(--ipbm-rose); color: #FFFFFF; }
    .tile-info .home-tile-icon    { background: var(--ipbm-teal); color: #FFFFFF; }

    .home-tile-label {
      font-size: 14px;
      font-weight: 800;
      color: #0F172A;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .home-tile-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--ipbm-rose);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 22px;
      text-align: center;
    }

    .home-install-cta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ipbm-teal-soft);
      border: 1.5px solid var(--ipbm-teal-border);
      color: #0F172A;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* LIVE Now / Room-by-Room Status Board */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .live-card {
      background: #FFFFFF;
      border: 1.5px solid var(--ipbm-rose-border);
      border-radius: 18px;
      padding: 13px 15px;
      box-shadow: 0 4px 14px rgba(189, 64, 110, 0.09);
    }
    .live-card.upcoming {
      border-color: #D8E4F2;
      box-shadow: 0 4px 14px rgba(24, 43, 89, 0.07);
    }
    .live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      background: #E11D48;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .live-pill.next { background: var(--ipbm-teal); }
    .live-pill.dday { background: var(--ipbm-navy); }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFFFFF;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    .live-clock {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ipbm-slate);
      font-variant-numeric: tabular-nums;
    }
    .live-progress {
      height: 4px;
      background: #FDE2E7;
      border-radius: 999px;
      margin-top: 6px;
      overflow: hidden;
    }
    .live-progress-bar {
      height: 100%;
      background: #E11D48;
      border-radius: 999px;
    }

    .room-board {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 6px;
    }
    .room-row {
      padding: 10px 12px;
      border-radius: 13px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      cursor: pointer;
    }
    .room-row.is-live {
      background: #FFF5F7;
      border-color: #FDA4AF;
    }
    .room-row.is-next {
      background: #EFFBF9;
      border-color: #99E6DC;
    }
    .room-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .room-name {
      font-size: 12px;
      font-weight: 800;
      color: #0F172A;
    }
    .room-status {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .room-status.live { background: #E11D48; color: #FFFFFF; }
    .room-status.next { background: var(--ipbm-teal); color: #FFFFFF; }
    .room-status.done { background: #E2E8F0; color: #475569; }
    .room-session-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #1E293B;
      margin-top: 4px;
      line-height: 1.35;
    }
    .room-session-time {
      font-size: 11px;
      color: #64748B;
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }

    /* One-Screen Zero-Scroll Home Layout (Official Mobile Page Style) */
    body.home-locked {
      overflow: hidden !important;
      overscroll-behavior: none !important;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .app-shell.is-home {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      touch-action: none;
      background-color: #FFFFFF;
      background-image: url('./assets/home_blossom_br.png');
      background-repeat: no-repeat;
      background-position: right bottom 52px;
      background-size: 56% auto;
    }
    .app-shell.is-home .main-content {
      flex: 1;
      min-height: 0;
      overflow: hidden !important;
      padding: 0 12px calc(58px + env(safe-area-inset-bottom)) !important;
      display: flex;
      flex-direction: column;
    }
    .app-shell.is-home .home-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px !important;
      padding-top: 0 !important;
    }
    .app-shell.is-home .home-visual-card {
      flex: 0 0 auto;
      width: calc(100% + 24px);
      margin: 0 -12px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .app-shell.is-home .home-visual-img {
      width: 100%;
      height: auto;
      max-height: 44dvh;
      object-fit: contain;
      object-position: top center;
      display: block;
    }
    .app-shell.is-home .home-menu-grid {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px !important;
      margin-top: 32px;
    }
    .app-shell.is-home .home-tile {
      min-height: 98px;
      padding: 13px 14px 11px !important;
      border-radius: 18px !important;
      border: none !important;
      background: linear-gradient(155deg, #524FB6 0%, #3E72C4 55%, #46A3D4 100%) !important;
      box-shadow: 0 8px 18px rgba(62, 114, 196, 0.24) !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      justify-content: space-between !important;
      position: relative;
    }
    .app-shell.is-home .home-tile-label {
      font-size: 15px !important;
      font-weight: 800 !important;
      color: #FFFFFF !important;
      text-align: left !important;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .app-shell.is-home .home-tile-icon {
      width: 42px !important;
      height: 42px !important;
      border-radius: 12px !important;
      background: rgba(255, 255, 255, 0.16) !important;
      color: #FFFFFF !important;
      box-shadow: none !important;
      align-self: flex-end !important;
    }
    .app-shell.is-home .home-tile-icon svg {
      width: 24px;
      height: 24px;
    }
    .app-shell.is-home .home-install-cta {
      display: none !important;
    }
    .app-shell.is-home .live-card {
      flex-shrink: 0;
      padding: 8px 10px !important;
      border-radius: 14px !important;
      background: rgba(255, 255, 255, 0.90) !important;
      backdrop-filter: blur(6px);
    }
    .app-shell.is-home .live-header {
      margin-bottom: 5px !important;
    }
    .app-shell.is-home .room-board {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px !important;
      margin-top: 0 !important;
      max-height: 112px;
      overflow-y: auto;
    }
    .app-shell.is-home .room-row {
      padding: 6px 8px !important;
      min-height: 44px !important;
      border-radius: 10px !important;
    }
    .app-shell.is-home .room-name {
      font-size: 11px !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-shell.is-home .room-session-title {
      font-size: 11px !important;
      margin-top: 3px !important;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .app-shell.is-home .room-session-time {
      font-size: 10px !important;
    }
    .app-shell.is-home .home-footer {
      flex-shrink: 0;
      padding: 0 !important;
      font-size: 10px !important;
      line-height: 1.2 !important;
    }
    .app-shell.is-home .home-footer > div:nth-child(1),
    .app-shell.is-home .home-footer > div:nth-child(2) {
      display: none;
    }
    .app-shell.is-home .home-footer .version-badge {
      margin-top: 0;
      padding: 1px 8px;
      font-size: 10px;
    }

    .home-footer {
      text-align: center;
      padding: 8px 8px 4px;
      color: #78909C;
      font-size: 11px;
      line-height: 1.55;
    }
    .home-footer b {
      color: var(--ipbm-navy);
      font-weight: 700;
    }
    .version-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ipbm-navy);
      background: var(--ipbm-navy-soft);
      border: 1px solid #DCE4F2;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* Session Cards */
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .session-card {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid var(--ipbm-border);
      border-left: 5px solid var(--ipbm-teal);
      padding: 13px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }
    .session-card:active { transform: scale(0.99); }
    .session-card.saved {
      box-shadow: 0 3px 12px rgba(21, 152, 141, 0.14);
      border-color: var(--ipbm-teal-border);
    }
    .session-card.is-live, .session-card.is-jumped {
      border: 2px solid #E11D48;
      border-left: 6px solid #E11D48;
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.22);
    }

    .tone-teal   { background: var(--pastel-teal);   border-left-color: #15988D; }
    .tone-rose   { background: var(--pastel-rose);   border-left-color: #BD406E; }
    .tone-navy   { background: var(--pastel-navy);   border-left-color: #182B59; }
    .tone-sky    { background: var(--pastel-sky);    border-left-color: #1C8BAE; }
    .tone-yellow { background: var(--pastel-yellow); border-left-color: #D49B15; }
    .tone-purple { background: var(--pastel-purple); border-left-color: #6A52B5; }
    .tone-peach  { background: var(--pastel-peach);  border-left-color: #D96B38; }
    .tone-gray   { background: #FFFFFF;              border-left-color: #90A4AE; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .time-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--ipbm-navy);
      font-variant-numeric: tabular-nums;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ipbm-charcoal);
      border: 1px solid rgba(24, 43, 89, 0.11);
    }

    .joint-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;

      color: var(--ipbm-slate);

      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;

    .action-primary { background: var(--ipbm-teal); color: #FFFFFF; }

    .section-heading {
      font-size: 14px;
      font-weight: 800;

      border: none;
      background: transparent;

      flex-direction: column;
      align-items: center;

      font-size: 11px;
      font-weight: 600;
      cursor: pointer;

      align-items: center;

    .sheet-backdrop {

      background: rgba(15, 23, 42, 0.5);

      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {

      max-width: 520px;
      max-height: 85vh;
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      padding: 12px 18px calc(20px + env(safe-area-inset-bottom));

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #CFD8DC;
      margin: 0 auto 12px;

    .detail-table {
      width: 100%;

      margin: 0;

      flex-direction: column;
      gap: 8px;
    }

      border-radius: 9px;
      border: 1px solid #E2E8F0;

      font-weight: 800;

      font-weight: 700;
      color: #0F172A;
      margin-top: 2px;

    .talk-speaker {
      font-size: 11.5px;
      color: #475569;
      margin-top: 2px;

    .sheet-actions {

      gap: 8px;
      margin-top: 16px;
    }
    .sheet-cta {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;

    .sheet-actions .sheet-cta { margin-top: 0; }

      background: #F1F5F9;
      color: #1E293B;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Interactive Floor Plan Map Locator */
    @keyframes mapPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55), inset 0 0 0 2px #E11D48; }
      50%      { box-shadow: 0 0 0 9px rgba(225, 29, 72, 0), inset 0 0 0 3px #E11D48; }
    }
    @keyframes pinBounce {
      0%, 100% { transform: translate(-50%, -100%) translateY(0); }
      50%      { transform: translate(-50%, -100%) translateY(-5px); }
    }
    .room-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #CBD5E1;
      color: var(--ipbm-navy);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .room-link-pill:active {
      background: var(--ipbm-teal);
      color: #FFFFFF;
      border-color: var(--ipbm-teal);
    }
    .floor-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .floor-room-btn {
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      color: var(--ipbm-charcoal);
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .floor-room-btn.active {
      background: #E11D48;
      border-color: #E11D48;
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(225, 29, 72, 0.25);
    }
    .floor-map-stage {
      position: relative;
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid #DCE4EE;
      border-radius: 14px;
      overflow: hidden;
    }
    .floor-map-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }
    .map-hit-zone {
      position: absolute;
      cursor: pointer;
      border-radius: 6px;
    }
    .map-highlight-box {
      position: absolute;
      background: rgba(225, 29, 72, 0.22);
      border: 3px solid #E11D48;
      border-radius: 8px;
      pointer-events: none;
      animation: mapPulse 1.3s infinite ease-in-out;
      z-index: 4;
    }
    .map-pin-badge {
      position: absolute;
      background: #E11D48;
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.32);
      border: 2px solid #FFFFFF;
      pointer-events: none;
      animation: pinBounce 1.1s infinite ease-in-out;
      z-index: 5;
    }
    .map-pin-badge::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      border-width: 6px 5px 0;
      border-style: solid;
      border-color: #E11D48 transparent transparent;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(82px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--ipbm-charcoal);
      color: #FFFFFF;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 80;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

    const BOARD_ROOMS = ['Room A', 'Room B', 'Room C', 'Grand Hall'];

    function toMin(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function sessionMatchesRoom(s, rg) {
      if (rg === 'ALL') return true;
      if (s.roomGroup === rg) return true;
      if (rg === 'Room A' && s.room.includes('A')) return true;
      if (rg === 'Room B' && s.room.includes('B')) return true;
      if (rg === 'Room C' && s.room.includes('C')) return true;
      return false;
    }

    // --- Real-Time Schedule Detection (KST / Asia/Seoul) ---
    const DAY_DATES = { 1: '2027-04-02', 2: '2027-04-03' };

    function getCurrentKstParts() {
      const now = new Date();
      try {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Seoul',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(now);
        const map = {};
        parts.forEach((p) => { map[p.type] = p.value; });
        const h = Number(map.hour === '24' ? '0' : map.hour);
        const m = Number(map.minute);
        return {
          dateStr: `${map.year}-${map.month}-${map.day}`,
          hhmm: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`,
          mins: h * 60 + m
        };
      } catch (_) {
        const y = now.getFullYear(), mo = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
        const h = now.getHours(), m = now.getMinutes();
        return { dateStr: `${y}-${mo}-${d}`, hhmm: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`, mins: h * 60 + m };
      }
    }

    function getLiveState() {
      const kst = getCurrentKstParts();
      const activeDay = Number(Object.keys(DAY_DATES).find((k) => DAY_DATES[k] === kst.dateStr)) || 0;

      if (activeDay > 0) {
        const todaySessions = SESSIONS.filter((s) => s.day === activeDay).sort((a, b) => toMin(a.start) - toMin(b.start));
        const liveNow = todaySessions.filter((s) => kst.mins >= toMin(s.start) && kst.mins < toMin(s.end));
        if (liveNow.length > 0) return { status: 'LIVE', day: activeDay, kst, items: liveNow };
        const upNext = todaySessions.filter((s) => toMin(s.start) > kst.mins);
        if (upNext.length > 0) {
          const nextStart = upNext[0].start;
          return { status: 'UP_NEXT', day: activeDay, kst, items: upNext.filter((s) => s.start === nextStart), diffMin: toMin(nextStart) - kst.mins };
        }
        if (activeDay < 2) {
          const tomorrowFirst = SESSIONS.filter((s) => s.day === activeDay + 1).sort((a, b) => toMin(a.start) - toMin(b.start))[0];
          return { status: 'UP_NEXT', day: activeDay + 1, kst, items: tomorrowFirst ? [tomorrowFirst] : [], diffMin: null };
        }
        return { status: 'AFTER', day: 2, kst, items: [] };
      }

      if (kst.dateStr < DAY_DATES[1]) {
        return { status: 'BEFORE', day: 1, kst, items: [] };
      }
      return { status: 'AFTER', day: 2, kst, items: [] };
    }

    function findCurrentSubTalk(session, mins) {
      if (!session || !session.talks || !session.talks.length) return null;
      for (const tk of session.talks) {
        const m = tk.time && tk.time.match(/^(\d{2}:\d{2})[–-](\d{2}:\d{2})$/);
        if (m) {
          const s = toMin(m[1]), e = toMin(m[2]);
          if (mins >= s && mins < e) return tk;
        }
      }
      return session.talks[0];
    }

    function jumpToProgramSession(sessionId, dayNum) {
      closeDetail();
      selectedDay = dayNum || 1;
      trackFilter = 'ALL';
      roomFilter = 'ALL';
      searchQuery = '';
      switchTab('program');
      setTimeout(() => {
        const el = document.getElementById('session-card-' + sessionId);
        if (el) {
          el.classList.add('is-jumped');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => el.classList.remove('is-jumped'), 2800);
        }
      }, 60);
    }

    function renderRoomBoardForDay(dayNum, kst, isKo) {
      const daySessions = SESSIONS.filter((s) => s.day === dayNum && s.id !== 'd1-reg').sort((a, b) => toMin(a.start) - toMin(b.start));
      const rows = BOARD_ROOMS.map((room) => {
        const rs = daySessions.filter((s) => sessionMatchesRoom(s, room));
        const live = rs.find((s) => kst.mins >= toMin(s.start) && kst.mins < toMin(s.end));
        if (live) {
          const total = Math.max(1, toMin(live.end) - toMin(live.start));
          const pct = Math.min(100, Math.max(5, Math.round(((kst.mins - toMin(live.start)) / total) * 100)));
          const rem = Math.max(1, toMin(live.end) - kst.mins);
          const subTalk = findCurrentSubTalk(live, kst.mins);
          const subHtml = subTalk
            ? '<div style="margin-top:5px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,0.92);border:1px solid #FECDD3;font-size:11.5px;color:#0F172A;line-height:1.35;">' +
                '🎤 <b>' + subTalk.time + '</b> ' + subTalk.topic +
                (subTalk.speaker ? '<div style="color:#BE123C;font-weight:700;margin-top:2px;">👤 ' + subTalk.speaker + '</div>' : '') +
              '</div>'
            : '';
          return {
            rank: 0,
            html: '<div class="room-row is-live" onclick="jumpToProgramSession(\'' + live.id + '\', ' + live.day + ')">' +
              '<div class="room-row-top">' +
                '<span class="room-name">📍 ' + room + '</span>' +
                '<span class="room-status live">● ' + (isKo ? '실시간 강의 ' + pct + '%' : 'LIVE ' + pct + '%') + '</span>' +
              '</div>' +
              '<div class="room-session-title">' + live.title + '</div>' +
              subHtml +
              '<div class="room-session-time" style="margin-top:5px;"><span>🕒 ' + live.start + '–' + live.end + ' (' + (isKo ? rem + '분 남음' : rem + 'm left') + ')</span><span style="color:#E11D48;font-weight:800;">' + (isKo ? '프로그램 이동 ›' : 'Go to Program ›') + '</span></div>' +
              '<div class="live-progress"><div class="live-progress-bar" style="width:' + pct + '%;"></div></div>' +
            '</div>'
          };
        }
        const next = rs.find((s) => toMin(s.start) > kst.mins);
        if (next) {
          const wait = toMin(next.start) - kst.mins;
          const subTalk = findCurrentSubTalk(next, toMin(next.start));
          return {
            rank: 1,
            html: '<div class="room-row is-next" onclick="jumpToProgramSession(\'' + next.id + '\', ' + next.day + ')">' +
              '<div class="room-row-top">' +
                '<span class="room-name">📍 ' + room + '</span>' +
                '<span class="room-status next">⏳ ' + (isKo ? wait + '분 후 시작' : 'in ' + wait + 'm') + '</span>' +
              '</div>' +
              '<div class="room-session-title">' + next.title + '</div>' +
              (subTalk ? '<div style="margin-top:4px;font-size:11px;color:#334155;">🎤 ' + subTalk.topic + (subTalk.speaker ? ' — <b>' + subTalk.speaker + '</b>' : '') + '</div>' : '') +
              '<div class="room-session-time" style="margin-top:4px;"><span>🕒 ' + next.start + '–' + next.end + '</span><span style="color:#15988D;font-weight:800;">' + (isKo ? '프로그램 이동 ›' : 'Go to Program ›') + '</span></div>' +
            '</div>'
          };
        }
        const last = rs[rs.length - 1];
        if (!last) return { rank: 3, html: '' };
        return {
          rank: 2,
          html: '<div class="room-row" onclick="jumpToProgramSession(\'' + last.id + '\', ' + last.day + ')">' +
            '<div class="room-row-top">' +
              '<span class="room-name">📍 ' + room + '</span>' +
              '<span class="room-status done">✓ ' + (isKo ? '종료' : 'Ended') + '</span>' +
            '</div>' +
            '<div class="room-session-title" style="color:#64748B;">' + last.title + '</div>' +
            '<div class="room-session-time"><span>🕒 ' + last.start + '–' + last.end + '</span><span style="color:#182B59;font-weight:700;">' + (isKo ? '프로그램 이동 ›' : 'Go to Program ›') + '</span></div>' +
          '</div>'
        };
      });
      rows.sort((a, b) => a.rank - b.rank);
      return '<div class="room-board">' + rows.map((r) => r.html).join('') + '</div>';
    }

    async function forceRefresh() {
      showToast(lang === 'ko' ? '최신 버전 불러오는 중...' : 'Checking for updates...');
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.update()));
        }
      } catch (_) {}
      const u = new URL(window.location.href);
      u.searchParams.set('v', Date.now());
      window.location.replace(u.toString());
    }

    function normalizeRoomKey(rawRoom) {
      if (!rawRoom) return 'Room A';

      if (rawRoom === 'Grand Hall') return 'Grand Hall 1';
      if (rawRoom.includes('Room A') && rawRoom.includes('Room B') && rawRoom.includes('Room C')) return 'Room A, B, C';
      if (rawRoom.includes('5, 6')) return 'Grand Hall 5, 6';

      const effH = String(Math.floor(effectiveMins / 60)).padStart(2, '0');

    function getHeaderDDayText() {
      const kst = getCurrentKstParts();
      if (kst.dateStr === '2027-04-02' || kst.dateStr === '2027-04-03') return 'D-DAY';
      const d1 = new Date('2027-04-02T00:00:00+09:00');
      const dn = new Date(kst.dateStr + 'T00:00:00+09:00');
      const diff = Math.round((d1 - dn) / 86400000);
      if (diff > 0) return 'D-' + diff;
      return 'D+' + Math.abs(diff);
    }

    // --- PWA Install & Service Worker ---
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    let installDismissed = false;

    function updateInstallBanner() {
      const banner = document.getElementById('installBanner');
      const msg = document.getElementById('installMsg');
      const btn = document.getElementById('installActionBtn');
      if (isStandalone || installDismissed) {
        banner.classList.remove('show');
        return;
      }
      if (deferredPrompt) {
        msg.textContent = T[lang].androidInstall;
        btn.textContent = T[lang].installBtn;
        btn.style.display = 'inline-block';
        banner.classList.add('show');
      } else if (isIOS) {
        msg.textContent = T[lang].iosInstall;
        btn.style.display = 'none';
        banner.classList.add('show');
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      updateInstallBanner();
    });

    function triggerInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(() => {
        deferredPrompt = null;
        updateInstallBanner();
      });
    }

    function dismissInstall() {
      installDismissed = true;
      updateInstallBanner();
    }

    if ('serviceWorker' in navigator) {
      let swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swReloading) return;
        swReloading = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch(() => {});
      });
    }

    render();
    updateInstallBanner();
    setInterval(() => {
      if (currentTab === 'home' || currentTab === 'program') renderBodyOnly();
    }, 60000);
  </script>
</body>
</html>
